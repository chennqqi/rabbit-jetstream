x-nats: &nats
  image: rabbit-jetstream/nats-server:local
  build:
    context: ../..
    dockerfile: packaging/Dockerfile.nats-server
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
    interval: 5s
    timeout: 2s
    retries: 12

services:
  nats-1:
    <<: *nats
    command: ["-c", "/etc/nats/nats.conf"]
    ports: ["4222:4222", "8222:8222"]
    volumes: ["../nats/cluster-1.conf:/etc/nats/nats.conf:ro", "nats-1:/data"]
  nats-2:
    <<: *nats
    command: ["-c", "/etc/nats/nats.conf"]
    volumes: ["../nats/cluster-2.conf:/etc/nats/nats.conf:ro", "nats-2:/data"]
  nats-3:
    <<: *nats
    command: ["-c", "/etc/nats/nats.conf"]
    volumes: ["../nats/cluster-3.conf:/etc/nats/nats.conf:ro", "nats-3:/data"]
  management:
    image: rabbit-jetstream/management:local
    build:
      context: ../..
      dockerfile: packaging/Dockerfile.management
    environment:
      RJS_NATS_URL: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      RJS_NATS_MONITOR_URLS: http://nats-1:8222,http://nats-2:8222,http://nats-3:8222
      RJS_ADMIN_TOKEN: ${RJS_ADMIN_TOKEN:-}
      RJS_METADATA_REPLICAS: 3
      RJS_CONTROLLER_INTERVAL: ${RJS_CONTROLLER_INTERVAL:-5s}
      RJS_CONTROLLER_LEASE_TTL: ${RJS_CONTROLLER_LEASE_TTL:-15s}
      RJS_INSTANCE_ID: ${RJS_INSTANCE_ID:-management-1}
    ports: ["8223:8223"]
    depends_on:
      nats-1:
        condition: service_healthy
      nats-2:
        condition: service_healthy
      nats-3:
        condition: service_healthy
  prometheus:
    image: prom/prometheus:v3.12.0-distroless
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    depends_on:
      - management

volumes:
  nats-1:
  nats-2:
  nats-3:
  prometheus-data:
