x-nats: &nats
  image: ${RJS_NATS_IMAGE:-rabbit-jetstream/nats-server:local}
  build:
    context: ../..
    dockerfile: packaging/Dockerfile.nats-server
  restart: unless-stopped
  stop_grace_period: 60s
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
    interval: 5s
    timeout: 2s
    retries: 12

services:
  nats-1:
    <<: *nats
    command: ["-c", "/etc/nats/nats.conf"]
    ports: ["4222:4222", "8222:8222"]
    volumes: ["../nats/cluster-1.conf:/etc/nats/nats.conf:ro", "nats-1:/data"]
  nats-2:
    <<: *nats
    command: ["-c", "/etc/nats/nats.conf"]
    volumes: ["../nats/cluster-2.conf:/etc/nats/nats.conf:ro", "nats-2:/data"]
  nats-3:
    <<: *nats
    command: ["-c", "/etc/nats/nats.conf"]
    volumes: ["../nats/cluster-3.conf:/etc/nats/nats.conf:ro", "nats-3:/data"]
  management:
    image: ${RJS_MANAGEMENT_IMAGE:-rabbit-jetstream/management:local}
    build:
      context: ../..
      dockerfile: packaging/Dockerfile.management
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      RJS_NATS_URL: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
      RJS_NATS_MONITOR_URLS: http://nats-1:8222,http://nats-2:8222,http://nats-3:8222
      RJS_ADMIN_TOKEN: ${RJS_ADMIN_TOKEN:-}
      RJS_ADMIN_TOKENS: ${RJS_ADMIN_TOKENS:-}
      RJS_AUDIT_TOKENS: ${RJS_AUDIT_TOKENS:-}
      RJS_OIDC_ISSUER: ${RJS_OIDC_ISSUER:-}
      RJS_OIDC_AUDIENCE: ${RJS_OIDC_AUDIENCE:-}
      RJS_OIDC_ROLE_CLAIM: ${RJS_OIDC_ROLE_CLAIM:-roles}
      RJS_OIDC_OPERATOR_ROLE: ${RJS_OIDC_OPERATOR_ROLE:-rabbit-jetstream-operator}
      RJS_OIDC_AUDITOR_ROLE: ${RJS_OIDC_AUDITOR_ROLE:-rabbit-jetstream-auditor}
      RJS_OIDC_ALLOW_INSECURE_ISSUER: ${RJS_OIDC_ALLOW_INSECURE_ISSUER:-false}
      RJS_OTEL_TRACES_ENDPOINT: ${RJS_OTEL_TRACES_ENDPOINT:-}
      RJS_OTEL_METRICS_ENDPOINT: ${RJS_OTEL_METRICS_ENDPOINT:-}
      RJS_OTEL_METRIC_INTERVAL: ${RJS_OTEL_METRIC_INTERVAL:-30s}
      RJS_OTEL_SAMPLE_RATIO: ${RJS_OTEL_SAMPLE_RATIO:-0.1}
      RJS_OTEL_ALLOW_INSECURE: ${RJS_OTEL_ALLOW_INSECURE:-false}
      RJS_METADATA_REPLICAS: 3
      RJS_CONTROLLER_INTERVAL: ${RJS_CONTROLLER_INTERVAL:-5s}
      RJS_CONTROLLER_LEASE_TTL: ${RJS_CONTROLLER_LEASE_TTL:-15s}
      RJS_INSTANCE_ID: ${RJS_INSTANCE_ID:-management-1}
    ports: ["8223:8223"]
    depends_on:
      nats-1:
        condition: service_healthy
      nats-2:
        condition: service_healthy
      nats-3:
        condition: service_healthy
  prometheus:
    image: prom/prometheus:v3.12.0-distroless@sha256:f39df5334dee301b885f77e0ff1159f5d8a43bf9db518f885544594799a1e3c2
    profiles: [observability]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    depends_on:
      - management

volumes:
  nats-1:
  nats-2:
  nats-3:
  prometheus-data:
