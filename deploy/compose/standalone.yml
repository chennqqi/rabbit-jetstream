services:
  nats:
    image: rabbit-jetstream/nats-server:local
    build:
      context: ../..
      dockerfile: packaging/Dockerfile.nats-server
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ../nats/standalone.conf:/etc/nats/nats.conf:ro
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 2s
      retries: 12
  management:
    image: rabbit-jetstream/management:local
    build:
      context: ../..
      dockerfile: packaging/Dockerfile.management
    environment:
      RJS_NATS_URL: nats://nats:4222
      RJS_NATS_MONITOR_URLS: http://nats:8222
    ports:
      - "8223:8223"
    depends_on:
      nats:
        condition: service_healthy

volumes:
  nats-data:
