services:
  nats:
    image: ${RJS_NATS_IMAGE:-rabbit-jetstream/nats-server:local}
    build:
      context: ../..
      dockerfile: packaging/Dockerfile.nats-server
    command: ["-c", "/etc/nats/nats.conf"]
    restart: unless-stopped
    stop_grace_period: 60s
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    ports:
      - "${RJS_NATS_CLIENT_PORT:-4222}:4222"
      - "${RJS_NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - ../nats/standalone.conf:/etc/nats/nats.conf:ro
      - nats-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 2s
      retries: 12
  management:
    image: ${RJS_MANAGEMENT_IMAGE:-rabbit-jetstream/management:local}
    build:
      context: ../..
      dockerfile: packaging/Dockerfile.management
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      RJS_DEPLOYMENT_PROFILE: standalone
      RJS_NATS_URL: nats://nats:4222
      RJS_NATS_MONITOR_URLS: http://nats:8222
      RJS_ADMIN_TOKEN: ${RJS_ADMIN_TOKEN:-}
      RJS_ADMIN_TOKENS: ${RJS_ADMIN_TOKENS:-}
      RJS_AUDIT_TOKENS: ${RJS_AUDIT_TOKENS:-}
      RJS_OIDC_ISSUER: ${RJS_OIDC_ISSUER:-}
      RJS_OIDC_AUDIENCE: ${RJS_OIDC_AUDIENCE:-}
      RJS_OIDC_ROLE_CLAIM: ${RJS_OIDC_ROLE_CLAIM:-roles}
      RJS_OIDC_OPERATOR_ROLE: ${RJS_OIDC_OPERATOR_ROLE:-rabbit-jetstream-operator}
      RJS_OIDC_AUDITOR_ROLE: ${RJS_OIDC_AUDITOR_ROLE:-rabbit-jetstream-auditor}
      RJS_OIDC_ALLOW_INSECURE_ISSUER: ${RJS_OIDC_ALLOW_INSECURE_ISSUER:-false}
      RJS_OIDC_BROWSER_CLIENT_ID: ${RJS_OIDC_BROWSER_CLIENT_ID:-}
      RJS_OIDC_BROWSER_REDIRECT_ORIGIN: ${RJS_OIDC_BROWSER_REDIRECT_ORIGIN:-}
      # Unconfigured RJS_PROMETHEUS_URL disables metric history and the alerts page (clear degraded state, no crash).
      # Alert-to-human notification still requires Alertmanager or an equivalent external component.
      RJS_PROMETHEUS_URL: ${RJS_PROMETHEUS_URL:-http://prometheus:9090}
      RJS_PROMETHEUS_PUBLIC_URL: ${RJS_PROMETHEUS_PUBLIC_URL:-}
      RJS_PROMETHEUS_TOKEN: ${RJS_PROMETHEUS_TOKEN:-}
      RJS_PROMETHEUS_ALLOW_INSECURE: ${RJS_PROMETHEUS_ALLOW_INSECURE:-true}
      RJS_OTEL_TRACES_ENDPOINT: ${RJS_OTEL_TRACES_ENDPOINT:-}
      RJS_OTEL_METRICS_ENDPOINT: ${RJS_OTEL_METRICS_ENDPOINT:-}
      RJS_OTEL_METRIC_INTERVAL: ${RJS_OTEL_METRIC_INTERVAL:-30s}
      RJS_OTEL_SAMPLE_RATIO: ${RJS_OTEL_SAMPLE_RATIO:-0.1}
      RJS_OTEL_ALLOW_INSECURE: ${RJS_OTEL_ALLOW_INSECURE:-false}
      RJS_METADATA_REPLICAS: 1
      RJS_CONTROLLER_INTERVAL: ${RJS_CONTROLLER_INTERVAL:-5s}
      RJS_CONTROLLER_LEASE_TTL: ${RJS_CONTROLLER_LEASE_TTL:-15s}
    ports:
      - "${RJS_MANAGEMENT_PORT:-8223}:8223"
    depends_on:
      nats:
        condition: service_healthy
  prometheus:
    image: prom/prometheus:v3.12.0-distroless@sha256:f39df5334dee301b885f77e0ff1159f5d8a43bf9db518f885544594799a1e3c2
    profiles: [observability]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    depends_on:
      - management

  alertmanager:
    image: ${RJS_ALERTMANAGER_IMAGE:-prom/alertmanager:v0.28.1}
    profiles: [observability]
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager", "--web.listen-address=:9093"]
    volumes:
      - ../observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports: ["9093:9093"]

volumes:
  nats-data:
  prometheus-data:
  alertmanager-data:
