nameOverride: ""
fullnameOverride: ""

# Enable fail-closed validation of production invariants. The default remains
# suitable for local rendering only; production installs must opt in.
production:
  enabled: false

nats:
  replicaCount: 3
  image:
    repository: rabbit-jetstream/nats-server
    tag: local
    digest: ""
    pullPolicy: IfNotPresent
  storage:
    size: 20Gi
    storageClass: ""
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 2Gi}
  tls:
    enabled: false
    # Both Secrets are required when enabled. Never reuse the server private key
    # for management or application clients.
    serverSecret: ""
    clientSecret: ""
    caKey: ca.crt
    certKey: tls.crt
    keyKey: tls.key
    serverName: ""

management:
  replicaCount: 2
  image:
    repository: rabbit-jetstream/management
    tag: local
    digest: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8223
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}
  telemetry:
    tracesEndpoint: ""
    metricsEndpoint: ""
    metricInterval: 30s
    sampleRatio: 0.1
    allowInsecure: false

# The operator image is an on-demand administration artifact, not a resident
# workload. Keeping it in chart values makes release-images.yaml directly
# consumable by Helm while preserving its immutable digest for runbooks.
operator:
  image:
    repository: rabbit-jetstream/operator
    tag: local
    digest: ""
    pullPolicy: IfNotPresent

auth:
  # Existing Secret keys: nats-username, nats-password,
  # nats-password-bcrypt, admin-token. Optional rotation/RBAC keys:
  # admin-tokens and audit-tokens (comma-separated).
  existingSecret: ""
  username: rjs
  oidc:
    issuer: ""
    audience: ""
    roleClaim: roles
    operatorRole: rabbit-jetstream-operator
    auditorRole: rabbit-jetstream-auditor
    allowInsecureIssuer: false

controller:
  interval: 5s
  leaseTTL: 15s

networkPolicy:
  enabled: true
  natsClients:
    # Convenient for a local namespace. Production requires false and uses
    # additionalPeers for explicitly approved application Pods.
    allowSameNamespace: true
    additionalPeers: []
  ingress:
    enabled: false
    namespaceSelector: {}
    podSelector: {}
  monitoring:
    enabled: false
    namespaceSelector: {}
    podSelector: {}
  egress:
    enabled: false
    dns:
      namespaceSelector:
        kubernetes.io/metadata.name: kube-system
      podSelector:
        k8s-app: kube-dns
    # Additional Kubernetes NetworkPolicy egress rules for explicitly approved
    # OIDC/OTLP destinations. Production rejects configured exporters/issuers
    # while this list is empty.
    additionalRules: []

podDisruptionBudget:
  enabled: true

serviceMonitor:
  enabled: false
  interval: 30s

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: rabbit-jetstream.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

nodeSelector: {}
tolerations: []
affinity: {}
