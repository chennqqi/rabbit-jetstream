apiVersion: v1
kind: Service
metadata:
  name: {{ include "rabbit-jetstream.fullname" . }}-management
  labels:
    {{- include "rabbit-jetstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: management
spec:
  type: {{ .Values.management.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "rabbit-jetstream.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: management
  ports:
    - name: http
      port: {{ .Values.management.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rabbit-jetstream.fullname" . }}-management
  labels:
    {{- include "rabbit-jetstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: management
spec:
  replicas: {{ .Values.management.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rabbit-jetstream.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: management
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rabbit-jetstream.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: management
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8223"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: management
          image: "{{ .Values.management.image.repository }}:{{ .Values.management.image.tag }}"
          imagePullPolicy: {{ .Values.management.image.pullPolicy }}
          env:
            - {name: RJS_NATS_URL, value: "nats://{{ include "rabbit-jetstream.fullname" . }}-nats:4222"}
            - name: RJS_NATS_MONITOR_URLS
              value: {{ include "rabbit-jetstream.monitorURLs" . | quote }}
            - name: RJS_NATS_USER
              valueFrom: {secretKeyRef: {name: {{ include "rabbit-jetstream.authSecret" . }}, key: nats-username}}
            - name: RJS_NATS_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "rabbit-jetstream.authSecret" . }}, key: nats-password}}
            - name: RJS_ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "rabbit-jetstream.authSecret" . }}, key: admin-token}}
            - {name: RJS_METADATA_REPLICAS, value: {{ .Values.nats.replicaCount | quote }}}
            - {name: RJS_CONTROLLER_INTERVAL, value: {{ .Values.controller.interval | quote }}}
            - {name: RJS_CONTROLLER_LEASE_TTL, value: {{ .Values.controller.leaseTTL | quote }}}
            - name: RJS_INSTANCE_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports:
            - {name: http, containerPort: 8223}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.management.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "rabbit-jetstream.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: management
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
