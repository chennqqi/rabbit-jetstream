apiVersion: v1
kind: Service
metadata:
  name: {{ include "rabbit-jetstream.fullname" . }}-management
  labels:
    {{- include "rabbit-jetstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: management
spec:
  type: {{ .Values.management.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "rabbit-jetstream.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: management
  ports:
    - name: http
      port: {{ .Values.management.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rabbit-jetstream.fullname" . }}-management
  labels:
    {{- include "rabbit-jetstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: management
spec:
  replicas: {{ .Values.management.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rabbit-jetstream.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: management
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rabbit-jetstream.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: management
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8223"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: management
          image: "{{ include "rabbit-jetstream.managementImage" . }}"
          imagePullPolicy: {{ .Values.management.image.pullPolicy }}
          env:
            - {name: RJS_NATS_URL, value: "{{ if .Values.nats.tls.enabled }}tls{{ else }}nats{{ end }}://{{ include "rabbit-jetstream.fullname" . }}-nats:4222"}
            - name: RJS_NATS_MONITOR_URLS
              value: {{ include "rabbit-jetstream.monitorURLs" . | quote }}
            - name: RJS_NATS_USER
              valueFrom: {secretKeyRef: {name: {{ include "rabbit-jetstream.authSecret" . }}, key: nats-username}}
            - name: RJS_NATS_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "rabbit-jetstream.authSecret" . }}, key: nats-password}}
            {{- if .Values.nats.tls.enabled }}
            - {name: RJS_NATS_TLS_CA, value: /etc/nats-tls/ca.crt}
            - {name: RJS_NATS_TLS_CERT, value: /etc/nats-tls/tls.crt}
            - {name: RJS_NATS_TLS_KEY, value: /etc/nats-tls/tls.key}
            - {name: RJS_NATS_TLS_SERVER_NAME, value: {{ default (printf "%s-nats" (include "rabbit-jetstream.fullname" .)) .Values.nats.tls.serverName | quote }}}
            {{- end }}
            - name: RJS_ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "rabbit-jetstream.authSecret" . }}, key: admin-token}}
            - name: RJS_ADMIN_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ include "rabbit-jetstream.authSecret" . }}
                  key: admin-tokens
                  optional: true
            - name: RJS_AUDIT_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ include "rabbit-jetstream.authSecret" . }}
                  key: audit-tokens
                  optional: true
            - {name: RJS_OIDC_ISSUER, value: {{ .Values.auth.oidc.issuer | quote }}}
            - {name: RJS_OIDC_AUDIENCE, value: {{ .Values.auth.oidc.audience | quote }}}
            - {name: RJS_OIDC_ROLE_CLAIM, value: {{ .Values.auth.oidc.roleClaim | quote }}}
            - {name: RJS_OIDC_OPERATOR_ROLE, value: {{ .Values.auth.oidc.operatorRole | quote }}}
            - {name: RJS_OIDC_AUDITOR_ROLE, value: {{ .Values.auth.oidc.auditorRole | quote }}}
            - {name: RJS_OIDC_ALLOW_INSECURE_ISSUER, value: {{ .Values.auth.oidc.allowInsecureIssuer | quote }}}
            - {name: RJS_OTEL_TRACES_ENDPOINT, value: {{ .Values.management.telemetry.tracesEndpoint | quote }}}
            - {name: RJS_OTEL_METRICS_ENDPOINT, value: {{ .Values.management.telemetry.metricsEndpoint | quote }}}
            - {name: RJS_OTEL_METRIC_INTERVAL, value: {{ .Values.management.telemetry.metricInterval | quote }}}
            - {name: RJS_OTEL_SAMPLE_RATIO, value: {{ .Values.management.telemetry.sampleRatio | quote }}}
            - {name: RJS_OTEL_ALLOW_INSECURE, value: {{ .Values.management.telemetry.allowInsecure | quote }}}
            - {name: RJS_METADATA_REPLICAS, value: {{ .Values.nats.replicaCount | quote }}}
            - {name: RJS_CONTROLLER_INTERVAL, value: {{ .Values.controller.interval | quote }}}
            - {name: RJS_CONTROLLER_LEASE_TTL, value: {{ .Values.controller.leaseTTL | quote }}}
            - name: RJS_INSTANCE_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports:
            - {name: http, containerPort: 8223}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.management.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          {{- if .Values.nats.tls.enabled }}
          volumeMounts:
            - {name: nats-tls, mountPath: /etc/nats-tls, readOnly: true}
          {{- end }}
      {{- if .Values.nats.tls.enabled }}
      volumes:
        - name: nats-tls
          secret:
            secretName: {{ include "rabbit-jetstream.tlsClientSecret" . }}
            items:
              - {key: {{ .Values.nats.tls.caKey | quote }}, path: ca.crt}
              - {key: {{ .Values.nats.tls.certKey | quote }}, path: tls.crt}
              - {key: {{ .Values.nats.tls.keyKey | quote }}, path: tls.key}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "rabbit-jetstream.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: management
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
