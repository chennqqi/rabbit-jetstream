apiVersion: v1
kind: Pod
metadata:
  name: {{ include "rabbit-jetstream.fullname" . }}-test-health
  labels:
    {{- include "rabbit-jetstream.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: health
      image: busybox:1.37.0
      command: ["wget", "-q", "-O", "-", "http://{{ include "rabbit-jetstream.fullname" . }}-management:{{ .Values.management.service.port }}/readyz"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
        readOnlyRootFilesystem: true
