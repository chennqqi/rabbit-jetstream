apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "rabbit-jetstream.fullname" . }}-nats
  labels:
    {{- include "rabbit-jetstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  serviceName: {{ include "rabbit-jetstream.fullname" . }}-nats-headless
  replicas: {{ .Values.nats.replicaCount }}
  podManagementPolicy: Parallel
  updateStrategy: {type: RollingUpdate}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rabbit-jetstream.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rabbit-jetstream.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: nats
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/nats-config.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nats
          image: "{{ .Values.nats.image.repository }}:{{ .Values.nats.image.tag }}"
          imagePullPolicy: {{ .Values.nats.image.pullPolicy }}
          args: ["-c", "/etc/nats/nats.conf"]
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: RJS_NATS_USER
              valueFrom: {secretKeyRef: {name: {{ include "rabbit-jetstream.authSecret" . }}, key: nats-username}}
            - name: RJS_NATS_PASSWORD_HASH
              valueFrom: {secretKeyRef: {name: {{ include "rabbit-jetstream.authSecret" . }}, key: nats-password-bcrypt}}
          ports:
            - {name: client, containerPort: 4222}
            - {name: cluster, containerPort: 6222}
            - {name: monitor, containerPort: 8222}
          readinessProbe:
            httpGet: {path: "/healthz?js-enabled-only=true", port: monitor}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /healthz, port: monitor}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.nats.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: config, mountPath: /etc/nats, readOnly: true}
            - {name: data, mountPath: /data}
            {{- if .Values.nats.tls.enabled }}
            - {name: nats-tls, mountPath: /etc/nats-tls, readOnly: true}
            {{- end }}
      volumes:
        - name: config
          configMap: {name: {{ include "rabbit-jetstream.fullname" . }}-nats}
        {{- if .Values.nats.tls.enabled }}
        - name: nats-tls
          secret:
            secretName: {{ include "rabbit-jetstream.tlsServerSecret" . }}
            items:
              - {key: {{ .Values.nats.tls.caKey | quote }}, path: ca.crt}
              - {key: {{ .Values.nats.tls.certKey | quote }}, path: tls.crt}
              - {key: {{ .Values.nats.tls.keyKey | quote }}, path: tls.key}
        {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "rabbit-jetstream.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: nats
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.nats.storage.storageClass }}
        storageClassName: {{ .Values.nats.storage.storageClass | quote }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.nats.storage.size }}}
