name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(find admin-ui api internal management tests tools -name '*.go' -print0 | xargs -0 gofmt -l)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests with race detector
        run: go test -race ./...
      - name: Enforce repository coverage
        run: make coverage-check
      - name: Reject breaking management API changes
        run: |
          if git show HEAD^:api/openapi.yaml >/tmp/rjs-openapi-baseline.yaml 2>/dev/null; then
            go run ./tools/apicompat --baseline /tmp/rjs-openapi-baseline.yaml --current api/openapi.yaml
          fi
      - name: Build management tools
        run: make build

  upstream-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # tools/upstreamcheck resolves the historical subtree squash commit.
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: upstream/nats-server/go.mod
          cache-dependency-path: upstream/nats-server/go.sum
      - name: Verify official NATS subtree provenance
        run: make verify-upstream-online
      - name: Build pinned NATS Server
        working-directory: upstream/nats-server
        run: go build .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Scan reachable Go vulnerabilities and release images
        shell: pwsh
        run: ./tests/security/scan.ps1

  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker compose -f deploy/compose/standalone.yml config --quiet
      - run: docker compose -f deploy/compose/cluster.yml config --quiet
      - name: Validate Helm deployment
        shell: pwsh
        run: ./tests/deployment/helm.ps1

  kubernetes-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install chart in a three-worker kind cluster
        run: tests/deployment/kubernetes-smoke.sh

  linux-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build and test Linux standalone distribution
        run: tests/integration/linux-smoke.sh

  linux-cluster-fault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify three-replica write during one-node outage
        run: tests/fault/single-node-recovery.sh

  management-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [api, reconcile, apply, delete, audit, auth, routing, dlq, metrics, diagnostics, controller]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify management ${{ matrix.scenario }} behavior
        shell: pwsh
        run: ./tests/integration/docker-desktop.ps1 -Scenario ${{ matrix.scenario }}

  rolling-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify three-node rolling upgrade and rollback
        shell: pwsh
        run: ./tests/integration/rolling-upgrade.ps1 -BuildLocal

  backup-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Destroy and restore JetStream data
        shell: pwsh
        run: ./tests/integration/backup-restore.ps1

  rabbitmq-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Convert and validate RabbitMQ definitions
        shell: pwsh
        run: ./tests/integration/migration.ps1
      - name: Capture and reconcile real RabbitMQ and JetStream shadows
        shell: pwsh
        run: ./tests/integration/shadow-capture.ps1

  performance-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify three-replica performance workload and message integrity
        shell: pwsh
        run: ./tests/performance/jetstream.ps1 -Mode ci -Output performance-ci.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-ci
          path: |
            performance-ci.json
            performance-ci.json.resources.ndjson
          retention-days: 30

  linux-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build NATS Server image
        run: docker buildx build --platform ${{ matrix.platform }} -f packaging/Dockerfile.nats-server --output type=cacheonly .
      - name: Build management image
        run: docker buildx build --platform ${{ matrix.platform }} -f packaging/Dockerfile.management --output type=cacheonly .
      - name: Build operator image
        run: docker buildx build --platform ${{ matrix.platform }} -f packaging/Dockerfile.operator --output type=cacheonly .
